name: Python Application

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron:  '0 2 2 * *'

jobs:
  using-python:
    runs-on: ubuntu-latest
    env:
        WORK_MAIL: ${{ secrets.WORK_MAIL }}
        MAIL_PASSWORDS: ${{ secrets.MAIL_PASSWORDS }}
        CC_MAIL: ${{ secrets.CC_MAIL }}
    steps:
      - uses: actions/checkout@v4

      # .python-version 固定 Python 3.14，uv.lock 固定依赖版本，本地与 CI 环境一致
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv run crawl4ai-setup

      - name: Get Data
        run: uv run python youtube_ranking_data.py
